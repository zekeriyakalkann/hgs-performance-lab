# perftest profili: HGS Performance Lab ile izole performans testi.
#
# Etkinlestirme: --spring.profiles.active=perftest (yalnizca bu profil; baska profil eklenirse uygulama baslamaz).
# Gercek sistemin application.properties dosyasi degistirilmez; bu dosyadaki degerler profil etkinken onu gecersiz kilar.
# Guvenlik denetimi: Config/PerfTestSafetyGuard.java. Asagidaki kosullardan biri saglanmazsa uygulama BASLAMAZ:
#   * server.address=127.0.0.1 ve server.port=18080 (8080'e dusulmez)
#   * veritabani adresi yalnizca loopback ve yalnizca hgs2_perftest_db
#   * kullanici adi/parola yalnizca asagidaki ortam degiskenlerinden gelir; 'postgres' kullanilamaz
#   * ddl-auto yalnizca none/validate; spring.jpa.properties.* (hibernate.dialect disinda) ve spring.datasource.hikari.* yok
#   * hibernate.* / jakarta.persistence.* / javax.persistence.* JVM sistem ozelligi yok (-D ile verilenler dahil)
#   * classpath'te hibernate.properties veya hibernate.cfg.xml yok
#   * test kullanicisi hibrit_giris_db veritabanina baglanmayi denediginde PostgreSQL yetki hatasi (42501) verir
#
# Gerekli ortam degiskenleri (degerleri bu dosyaya veya depoya YAZILMAZ):
#   HGS_PERFTEST_DB_USERNAME  ayri test kullanicisi (rol) adi
#   HGS_PERFTEST_DB_PASSWORD  bu kullanicinin parolasi

server.address=127.0.0.1
server.port=18080

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/hgs2_perftest_db
spring.datasource.username=${HGS_PERFTEST_DB_USERNAME}
spring.datasource.password=${HGS_PERFTEST_DB_PASSWORD}

# Sema degistirilmez. create / create-drop / update, veritabani izolasyonu dogrulanana kadar kullanilmaz
# ve PerfTestSafetyGuard tarafindan reddedilir.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=never
