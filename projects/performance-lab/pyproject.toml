[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hgs2-lab"
version = "0.1.0"
description = "HGS2 API için akademik performans testi ve analiz aracı"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "urllib3>=2"]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[project.scripts]
hgs2-lab = "hgs2_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Entegrasyon testleri varsayılan çalıştırmada hariçtir; komut satırındaki -m bunu geçersiz kılar.
addopts = "--strict-markers -m 'not integration'"
markers = [
    "integration: yalnızca 127.0.0.1 üzerindeki yerel HTTP sunucusunu kullanan entegrasyon testleri (pytest -m integration)",
]
